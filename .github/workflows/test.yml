name: RTL tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install --yes iverilog
      - name: Install Python test dependencies
        run: python -m pip install -r test/requirements-test.txt
      - name: Run directed and cocotb tests
        run: python test/run_tests.py --all